name: Action Notifier CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-telegram:
    name: Test Telegram Notification
    runs-on: ubuntu-latest
    if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Telegram Notification
        if: always()
        uses: ./
        with:
          provider: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          message: "<b>🔔 CI Test Notification (Telegram)</b>"

  test-discord:
    name: Test Discord Notification
    runs-on: ubuntu-latest
    if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Discord Notification
        if: always()
        uses: ./
        with:
          provider: discord
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          message: "🔔 **CI Test Notification (Discord)**"
