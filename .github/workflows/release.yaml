name: Release New Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type from previous release (ignored if custom_tag is set)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      custom_tag:
        description: "Optional exact version tag (e.g., v2.0.0). Leave empty for auto-bump"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Auto Tag & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize custom tag input
        id: normalize
        env:
          RAW_TAG: ${{ inputs.custom_tag }}
        run: |
          echo "custom_tag=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Bump version and create Git tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          default_bump: ${{ inputs.bump }}
          custom_tag: ${{ steps.normalize.outputs.custom_tag }}

      - name: Update floating major tag (e.g., v1, v2)
        if: steps.tag_version.outputs.new_tag != '' && !inputs.prerelease
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          MAJOR_TAG=$(echo "$NEW_TAG" | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG tag to $NEW_TAG"
          git push origin "$MAJOR_TAG" --force

      - name: Build release notes from plain-text Git commits
        id: release_notes
        if: steps.tag_version.outputs.new_tag != ''
        env:
          PREV_TAG: ${{ steps.tag_version.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "v0.0.0" ] || [ "$PREV_TAG" = "0.0.0" ] || ! git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log HEAD --pretty=format:"- %s (%h) by %an" --no-merges)
            COMPARE_LINE=""
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h) by %an" --no-merges)
            COMPARE_LINE="**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${NEW_TAG}"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No new commits since ${PREV_TAG}"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            if [ -n "$COMPARE_LINE" ]; then
              echo ""
              echo "$COMPARE_LINE"
            fi
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.release_notes.outputs.body }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false

      - name: Update docs with latest released version
        if: success() && steps.tag_version.outputs.new_tag != '' && !inputs.prerelease
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          # Replace devlopersabbir/action-notifier@<version> across README.md and wiki/*.md
          sed -i -E "s|(devlopersabbir/action-notifier@)v[0-9A-Za-z._-]+|\1${NEW_TAG}|g" README.md wiki/*.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet README.md wiki/; then
            git add README.md wiki/*.md
            git commit -m "docs: update action version to ${NEW_TAG} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            # Keep release tag and floating major tag aligned with updated docs
            MAJOR_TAG=$(echo "$NEW_TAG" | cut -d. -f1)
            git tag -fa "$NEW_TAG" -m "Release $NEW_TAG"
            git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG tag to $NEW_TAG"
            git push origin "$NEW_TAG" --force
            git push origin "$MAJOR_TAG" --force
          fi

